[mcp_servers.meko]
url = "https://mcp.mekodata.ai/mcp"
bearer_token_env_var = "MEKO_API_TOKEN"
http_headers = { "User-Agent" = "meko-mcp-installer/1.0" }

[mcp_servers.standards-guard]
command = "node"
args = ["packages/guard-cli/dist/bin.js", "mcp"]
env_vars = ["MEKO_API_TOKEN"]
default_tools_approval_mode = "approve"

[mcp_servers.standards-guard.env]
GUARD_MODE = "live"
MEKO_MCP_URL = "https://mcp.mekodata.ai/mcp"
MEKO_DATAPACK = "payledger-standards-guard"
